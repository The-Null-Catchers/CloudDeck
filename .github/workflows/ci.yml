name: CI
on: [push, pull_request, workflow_dispatch]
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  node:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env: {POSTGRES_USER: clouddeck, POSTGRES_PASSWORD: testpass, POSTGRES_DB: clouddeck}
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U clouddeck" --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgres://clouddeck:testpass@localhost:5432/clouddeck
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-test-secret-at-least-thirty-two-characters
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm}
      - run: npm ci
      - run: npm run migrate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
  agent:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: services/agent}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version: '1.23', cache: false}
      - run: go mod download
      - run: go test ./...
      - run: go build ./...

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true
      - run: chmod +x tool/bootstrap_android.sh
      - run: ./tool/bootstrap_android.sh
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --release --dart-define=CLOUDDECK_API_URL=https://api.example.invalid
      - uses: actions/upload-artifact@v4
        with:
          name: clouddeck-android-release-smoke
          path: apps/mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 7
